[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morumbi3d"
version = "0.1.0"
description = "Busca e curadoria de modelos 3D prontos para a Morumbi 3D"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Nada aqui e obrigatorio: o analisador de malha e o cortador proprios rodam
# so com a biblioteca padrao. Com estes instalados, o trimesh vira conferencia
# extra da analise e ultimo recurso no corte de letra grande. scipy, networkx
# e rtree entram porque o trimesh precisa deles e so reclama tarde.
malha = [
    "trimesh>=4.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "networkx>=3.0",
    "rtree>=1.0",
]

# O sistema de gestao (telas de entrada e painel). Os geradores e a
# curadoria continuam rodando sem isto.
sistema = ["flask>=3.0"]

# Os testes de navegador (tests/test_navegador.py). Ficam de fora da VPS de
# proposito: 400 MB de Chromium para provar coisa que so acontece na tela de
# quem desenvolve. Sem eles a suite PULA esses testes e continua verde --
# entao rode-os antes de subir uma tela nova, ou o pulo vira falso "OK".
#     pip install -e ".[navegador]" && playwright install chromium
navegador = ["playwright>=1.40"]

[project.scripts]
morumbi3d = "morumbi3d.cli:main"

[tool.setuptools.packages.find]
include = ["morumbi3d*", "sistema*"]

[tool.setuptools.package-data]
sistema = ["templates/*.html", "static/*.css"]
