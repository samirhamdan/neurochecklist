[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morumbi3d"
version = "0.1.0"
description = "Busca e curadoria de modelos 3D prontos para a Morumbi 3D"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Conferencia extra da analise de malha. Nada aqui e obrigatorio: o
# analisador proprio (STL/3MF/OBJ) roda so com a biblioteca padrao.
malha = ["trimesh>=4.0", "numpy>=1.24"]

[project.scripts]
morumbi3d = "morumbi3d.cli:main"

[tool.setuptools.packages.find]
include = ["morumbi3d*"]
