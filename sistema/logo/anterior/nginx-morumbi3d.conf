# /etc/nginx/sites-available/morumbi3d
# Troque morumbi3d.duckdns.org pelo dominio ou pelo IP do VPS.

server {
    listen 80;
    server_name morumbi3d.duckdns.org;

    # Precisa bater com o limite do Flask (25 MB), senao o nginx
    # corta o upload antes e o erro fica confuso de diagnosticar.
    client_max_body_size 25M;

    # Gerar STL demora. Sem isso o nginx desiste em 60s e devolve 504
    # enquanto o gunicorn ainda esta trabalhando direitinho.
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
