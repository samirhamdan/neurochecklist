<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de letreiros — Morumbi 3D</title>
<style>
:root{
  --concreto:#E8EBE9; --painel:#FFFFFF; --tinta:#16202B; --tinta2:#5C6B79;
  --regua:#D3D9DC; --acao:#1E5FA8; --alerta:#A8471C; --ok:#2C6E4A;
  --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--concreto);color:var(--tinta);font-family:var(--sans);font-size:15px;line-height:1.6}
.topo{background:var(--painel);border-bottom:1px solid var(--regua);padding:14px 22px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.marca{font-family:"LetreiroFonte",var(--sans);font-size:26px;letter-spacing:.5px}
.topo p{margin:0;color:var(--tinta2);font-size:13.5px}
.topo .volta{margin-left:auto;font-size:14px;color:#0040F0;text-decoration:none;
  border:1px solid var(--regua);border-radius:5px;padding:6px 12px}
.topo .volta:hover{border-color:#0040F0}
.grade{display:grid;grid-template-columns:352px 1fr;gap:20px;padding:20px;align-items:start;max-width:1400px;margin:0 auto}
@media (max-width:900px){.grade{grid-template-columns:1fr}}
.painel,.mesa-area{background:var(--painel);border:1px solid var(--regua);border-radius:10px;padding:18px}
.campo{margin-bottom:18px}
.campo:last-child{margin-bottom:0}
label{display:block;font-size:13px;color:var(--tinta2);margin-bottom:6px}
input[type=text],input[type=number],select{width:100%;padding:9px 11px;border:1px solid var(--regua);border-radius:7px;font:inherit;font-size:15px;background:#fff;color:var(--tinta)}
input[type=text]{font-size:19px}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acao);outline-offset:2px}
.linha{display:flex;gap:7px}
.linha>*{flex:1}
.opt{padding:9px 4px;border:1px solid var(--regua);background:#fff;border-radius:7px;cursor:pointer;font:inherit;font-size:14px;color:var(--tinta2)}
.opt[aria-pressed=true]{background:var(--acao);border-color:var(--acao);color:#fff}
.opt:disabled{opacity:.45;cursor:not-allowed}
.cores{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grade-opt{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
canvas{width:100%;height:auto;display:block;border-radius:6px}
#produto{background:#F4F6F5}
.dupla{display:grid;grid-template-columns:190px 1fr;gap:16px;align-items:start}
@media (max-width:520px){.dupla{grid-template-columns:1fr}}
.lado{min-width:0}
.info{margin-top:16px;border-top:1px solid var(--regua);padding-top:14px}
.estado{margin:0 0 8px;color:var(--tinta2);font-size:14px}
.estado:empty{display:none}
.info dl{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;margin:0;font-size:14px}
.info dt{color:var(--tinta2)}
.info dd{margin:0}
.preco{font-size:22px;font-weight:600;color:var(--acao)}
.aviso{margin-top:12px;padding:10px 12px;border-radius:7px;font-size:14px;border:1px solid}
.aviso.mal{background:#FBF0EB;border-color:#E5C3B2;color:var(--alerta)}
.aviso.bem{background:#EEF5F0;border-color:#C2DBCB;color:var(--ok)}
.baixar{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.btn{padding:11px 14px;border:none;border-radius:7px;background:var(--acao);color:#fff;font:inherit;font-size:14.5px;cursor:pointer;text-align:left}
.btn:disabled{background:#C7CDD2;cursor:not-allowed}
.btn small{display:block;opacity:.85;font-size:12.5px;word-break:break-all}
</style>
</head>
<body>

<header class="topo">
  <span class="marca">Morumbi 3D</span>
  <p>Digite o nome, confira se cabe na mesa e baixe os arquivos.</p>
  <a class="volta" href="/criar">← Criar</a>
</header>

<div class="grade">
  <form class="painel" onsubmit="return false">
    <div class="campo">
      <label for="nome">Nome</label>
      <input type="text" id="nome" value="João Pedro" autocomplete="off" spellcheck="false">
    </div>

    <div class="campo">
      <label>Produto</label>
      <div class="grade-opt" id="prod">
        <button type="button" class="opt" data-v="classico" aria-pressed="true">Clássico</button>
        <button type="button" class="opt" data-v="magia">Magia</button>
        <button type="button" class="opt" data-v="gamer">Gamer</button>
        <button type="button" class="opt" data-v="cinema">Cinema</button>
        <button type="button" class="opt" data-v="futuro">Futuro</button>
        <button type="button" class="opt" data-v="terror">Terror</button>
      </div>
    </div>

    <div class="campo">
      <label>Tamanho</label>
      <div class="linha" id="tam">
        <button type="button" class="opt" data-v="170">17 cm</button>
        <button type="button" class="opt" data-v="220" aria-pressed="true">22 cm</button>
        <button type="button" class="opt" data-v="280">28 cm</button>
      </div>
    </div>

    <div class="campo" id="boxDisp" hidden>
      <label>Nome composto</label>
      <div class="linha" id="disp">
        <button type="button" class="opt" data-v="2" aria-pressed="true">Duas linhas</button>
        <button type="button" class="opt" data-v="1">Uma linha</button>
      </div>
    </div>

    <div class="campo" id="boxBase">
      <label>Letras (versão 1 cor)</label>
      <div class="linha" id="base">
        <button type="button" class="opt" data-v="8" aria-pressed="true">Com base</button>
        <button type="button" class="opt" data-v="0">Encaixadas</button>
      </div>
    </div>

    <div class="campo" id="boxVer">
      <label>Versão</label>
      <div class="linha" id="ver">
        <button type="button" class="opt" data-v="1" aria-pressed="true">1 cor</button>
        <button type="button" class="opt" data-v="2">2 cores</button>
      </div>
    </div>

    <div class="campo cores">
      <div><label for="c0" id="l0">Cor</label><select id="c0"></select></div>
      <div id="b1" hidden><label for="c1" id="l1">Cor da frente</label><select id="c1"></select></div>
      <div id="b2" hidden><label for="c2">Cor da face</label><select id="c2"></select></div>
    </div>

    <div class="campo">
      <label for="alt">Altura máxima das letras</label>
      <select id="alt">
        <option value="auto" selected>Automática (padrão)</option>
        <option value="48">48 mm</option>
        <option value="55">55 mm</option>
        <option value="60">60 mm</option>
        <option value="65">65 mm</option>
        <option value="0">Sem limite</option>
      </select>
    </div>

    <div class="campo">
      <label for="esp">Espessura</label>
      <select id="esp">
        <option value="6">6 mm — parede</option>
        <option value="12" selected>12 mm — mesa</option>
        <option value="60">60 mm — luminária</option>
      </select>
    </div>

    <div class="campo cores" style="margin-top:18px">
      <div><label for="piso">Piso R$</label><input type="number" id="piso" value="18" min="0" step="1"></div>
      <div><label for="pgrama">R$ por grama</label><input type="number" id="pgrama" value="0.60" min="0" step="0.05"></div>
    </div>

    <div class="baixar" id="baixar"></div>
  </form>

  <div class="mesa-area">
    <canvas id="produto" width="1000" height="620" aria-label="Prévia da peça como ela fica em pé na mesa"></canvas>
    <div class="info">
      <div class="dupla">
        <canvas id="mesa" width="620" height="620" aria-label="Posição da peça na mesa de impressão"></canvas>
        <div class="lado">
      <p id="estado" class="estado">Carregando a fonte…</p>
      <dl id="dados"></dl>
        </div>
      </div>
      <div id="avisos"></div>
    </div>
  </div>
</div>

<!-- As fontes sairam daqui no C2: o topo de bolo usa as mesmas cinco, e
     473 KB de base64 duplicados seriam corrigidos em um lugar so. -->
<script src="fontes/fontes.js"></script>
<!-- opentype, ClipperLib e earcut. Sairam daqui no C2: o topo de bolo usa
     as mesmas tres. -->
<script src="libs/libs.js"></script>
<!-- O nucleo saiu daqui no sprint C1. Estava inline porque comecou como um
     arquivo so; com o segundo gerador a caminho, codigo comum preso dentro
     de uma tela vira codigo copiado. Caminho relativo de proposito: a pagina
     roda servida pelo Flask e aberta como file:// pelas ferramentas. -->
<script src="nucleo/nucleo.js"></script>
<script src="nucleo/texto.js"></script>
<script src="nucleo/oficina.js"></script>
<script src="nucleo/letreiro.js"></script>
<script>
(function(){
  const MESA = MorumbiNucleo.MESA;   // a mesa e da plataforma, nao desta tela
  // cada espessura tem seu preenchimento: parede fina precisa de mais miolo para nao trincar
  // ESPESSURAS, a estimativa, o que cabe na mesa, o preco e o nome do arquivo
  // moraram aqui ate o C1. Sao da plataforma: o proximo gerador precisa dos
  // MESMOS numeros, e duas copias viram dois numeros diferentes no dia em que
  // um deles for corrigido.
  const O = MorumbiOficina, ESPESSURAS = O.ESPESSURAS;
  const CORES = [["Branco","#F2F0EA"],["Preto","#23262A"],["Vermelho","#C0392B"],["Azul","#1E63A8"],
    ["Rosa","#E0669A"],["Amarelo","#E8B92E"],["Verde","#3E9B54"],["Roxo","#7B52AB"],
    ["Laranja","#E0752A"],["Dourado","#C9A227"],["Prata","#B9BEC4"]];
  const hex = n => (CORES.find(c=>c[0]===n)||[,"#888"])[1];
  const $ = id => document.getElementById(id);

  const PADRAO = { largura:220, versao:1, produto:"classico", duas:true, alt:"auto", base:8, esp:12 };
  const CHAVE = "morumbi3d.letreiro";

  // Reimprimir e regerar: sem isto, refazer a peca de um cliente e caçar o
  // arquivo antigo e adivinhar em que tamanho ele saiu. O nome fica junto
  // porque e ele que manda no resto.
  function guardado() {
    try {
      const bruto = localStorage.getItem(CHAVE);
      if (!bruto) return null;
      const g = JSON.parse(bruto);
      // So o que o gerador entende: chave desconhecida vinda de uma versao
      // antiga nao pode virar parametro.
      const limpo = {};
      for (const k of Object.keys(PADRAO)) if (k in g) limpo[k] = g[k];
      return { est: limpo, nome: typeof g.nome === "string" ? g.nome : null };
    } catch (e) { return null; }
  }
  function guardar() {
    try { localStorage.setItem(CHAVE, JSON.stringify({ ...est, nome: $("nome").value })); }
    catch (e) { /* aba anonima, ou disco cheio: nao e motivo para travar a tela */ }
  }

  const salvo = guardado();
  const est = Object.assign({}, PADRAO, (salvo && salvo.est) || {});
  let G=null, R=null, atual=null;

  ["c0","c1","c2"].forEach((id,i)=>{
    CORES.forEach(([n])=>$(id).insertAdjacentHTML("beforeend",`<option>${n}</option>`));
    $(id).value = ["Vermelho","Preto","Branco"][i];
    $(id).addEventListener("change", pintar);
  });

  function grupo(id, chave, tipo){
    $(id).addEventListener("click", e=>{
      const b = e.target.closest(".opt"); if(!b || b.disabled) return;
      [...$(id).children].forEach(x=>x.setAttribute("aria-pressed", x===b));
      est[chave] = tipo === "num" ? +b.dataset.v : tipo === "bool" ? b.dataset.v === "2" : b.dataset.v;
      ajustarControles(); agendar(); guardar();
    });
  }
  grupo("tam","largura","num"); grupo("ver","versao","num");
  grupo("prod","produto","txt"); grupo("disp","duas","bool"); grupo("base","base","num");
  $("esp").addEventListener("change", ()=>{ est.esp = +$("esp").value; agendar(); guardar(); });
  $("piso").addEventListener("input", pintar);
  $("pgrama").addEventListener("input", pintar);
  $("alt").addEventListener("change", ()=>{ const v=$("alt").value; est.alt = v==="auto"?"auto":+v; agendar(); guardar(); });
  $("nome").addEventListener("input", ()=>{ ajustarControles(); agendar(); guardar(); });

  function ajustarControles(){
    const composto = /\s/.test($("nome").value.trim());
    $("boxDisp").hidden = !composto;
    const fixo = MorumbiLetreiro.PRODUTOS[est.produto] && MorumbiLetreiro.PRODUTOS[est.produto].cores;
    $("boxVer").hidden = !!fixo;
    const n = fixo || est.versao;
    $("boxBase").hidden = n !== 1;
    $("b1").hidden = n < 2; $("b2").hidden = n < 3;
    $("l0").textContent = n === 1 ? "Cor" : est.produto === "magia" ? "Cor da base" : "Cor do corpo";
    $("l1").textContent = "Cor da frente";
  }

  let timer=null;
  function agendar(){ clearTimeout(timer); timer = setTimeout(rodar, 220); }


  function rodar(){
    const nome = $("nome").value.trim();
    if(!G || !nome){ atual = null; pintar(); return; }
    $("estado").textContent = "Calculando…";
    setTimeout(()=>{
      let falha = null;
      try{
        R = G.gerar(nome, est.largura, est.esp, est.produto, est.duas, est.alt === "auto" ? "auto" : (est.alt || null), ((MorumbiLetreiro.PRODUTOS[est.produto]||{}).cores || est.versao) === 1 ? est.base : 0);
        atual = montar();
      }catch(err){ atual = null; falha = err; }
      try{ pintar(); }catch(err){ falha = falha || err; }
      $("estado").textContent = falha ? ("Não consegui gerar esse nome: " + falha.message) : "";
    }, 10);
  }

  function montar(){
    const slug = R.word.replace(/ /g,"-");
    const prod = est.produto.toUpperCase();
    const fixo = MorumbiLetreiro.PRODUTOS[est.produto] && MorumbiLetreiro.PRODUTOS[est.produto].cores;
    const n = fixo || est.versao;
    const lista = n === 1 ? [R.simples] : (R.viavel ? R.pecas : []);
    return lista.map((s,i)=>{
      const cor = $(["c0","c1","c2"][i]).value;
      const t = Math.round(s.camadas[s.camadas.length-1].z1 - s.camadas[0].z0);
      const rot = s.rot ? s.rot : prod;
      const vist = O.vistoriar(s);
      return Object.assign({}, s, { cor, vist, enc: vist.enc,
        nomeArq: O.nomeDeArquivo({ nome: R.word, rotulo: rot, cor, bb: s.bb,
                                   espessura: est.esp, altura: t }),
        vol: O.volume(s.camadas) });
    });
  }

  function traco(ctx, paths, k, ox, oy){
    ctx.beginPath();
    for(const p of paths){
      p.forEach((pt,i)=>{ const x=(pt.X/1e4-ox)*k, y=-(pt.Y/1e4-oy)*k; i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
      ctx.closePath();
    }
  }

  function escurecer(h, f){
    const n = parseInt(h.slice(1),16);
    const r = Math.round(((n>>16)&255)*(1-f)), g = Math.round(((n>>8)&255)*(1-f)), b = Math.round((n&255)*(1-f));
    return `rgb(${r},${g},${b})`;
  }

  // vista do produto em pe: mostra a massa do corpo atras da face
  function pintarProduto(){
    const c = $("produto"), ctx = c.getContext("2d"), W = c.width, H = c.height;
    ctx.clearRect(0,0,W,H);
    if(!atual || !atual.length) return;
    const bb = atual[0].bb, dx = est.esp*0.45, dy = est.esp*0.30, m = 34;
    const k = Math.min((W-2*m)/(bb.w+dx), (H-2*m)/(bb.h+dy));
    const ox = bb.minX + bb.w/2 + dx/2, oy = bb.minY + bb.h/2 + dy/2;
    ctx.save(); ctx.translate(W/2, H/2);
    const fundo = atual[0].camadas[0].paths, N = 26;
    ctx.fillStyle = escurecer(hex($("c0").value), 0.42);
    for(let i=N;i>=1;i--){ traco(ctx, fundo, k, ox - dx*i/N, oy - dy*i/N); ctx.fill("nonzero"); }
    atual.forEach((s,i)=>{ ctx.fillStyle = hex($(["c0","c1","c2"][i]).value);
      traco(ctx, s.camadas[0].paths, k, ox, oy); ctx.fill("nonzero"); });
    ctx.strokeStyle = "rgba(0,0,0,.32)"; ctx.lineWidth = 1.1;
    traco(ctx, fundo, k, ox, oy); ctx.stroke();
    ctx.restore();
  }

  function pintar(){ pintarProduto(); pintarMesa(); informar(); }

  function pintarMesa(){
    const c = $("mesa"), ctx = c.getContext("2d"), L = c.width;
    ctx.clearRect(0,0,L,L);
    const m = 40, k = (L-m*2)/MESA;
    ctx.fillStyle="#F4F6F5"; ctx.fillRect(m,m,MESA*k,MESA*k);
    ctx.strokeStyle="#DDE2E4"; ctx.lineWidth=1;
    for(let i=32;i<MESA;i+=32){
      ctx.beginPath(); ctx.moveTo(m+i*k,m); ctx.lineTo(m+i*k,m+MESA*k);
      ctx.moveTo(m,m+i*k); ctx.lineTo(m+MESA*k,m+i*k); ctx.stroke();
    }
    ctx.strokeStyle="#9AA6AE"; ctx.lineWidth=2; ctx.strokeRect(m,m,MESA*k,MESA*k);
    ctx.fillStyle="#8A959D"; ctx.font="22px "+getComputedStyle(document.body).fontFamily;
    ctx.fillText("mesa 256 mm", m, m-12);

    if(atual && atual.length){
      const p0 = atual[0], bb = p0.bb;
      ctx.save();
      ctx.translate(m+MESA*k/2, m+MESA*k/2);
      ctx.rotate(-p0.enc.ang*Math.PI/180);
      const ox = bb.minX + bb.w/2, oy = bb.minY + bb.h/2;
      ctx.fillStyle = hex($("c0").value);
      traco(ctx, p0.camadas[0].paths, k, ox, oy); ctx.fill("nonzero");
      ctx.strokeStyle = "rgba(0,0,0,.3)"; ctx.lineWidth = 1.4; ctx.stroke();
      ctx.restore();
    }
  }

  function informar(){
    const dl = $("dados"), av = $("avisos"), bx = $("baixar");
    if(!atual){ dl.innerHTML=""; av.innerHTML=""; bx.innerHTML=""; $("estado").textContent="Digite um nome para começar."; return; }
    if(!atual.length){
      dl.innerHTML=""; bx.innerHTML="";
      av.innerHTML = `<div class="aviso mal">${R.motivo || "Não dá para gerar esse produto nesse tamanho."}</div>`;
      return;
    }
    const oca = !!(R.luminaria && R.luminaria.possivel);
    const p = atual[0], e = O.estimar(atual.reduce((s,x)=>s+x.vol,0), est.esp, oca);
    const cores = atual.length, purga = O.purga(cores);
    const gTotal = e.g + purga, minTotal = gTotal * 1.6;
    const piso = +$("piso").value || 0, pg = +$("pgrama").value || 0;
    const preco = O.precoComercial(gTotal, piso, pg);
    const porHora = minTotal > 0 ? preco / (minTotal/60) : 0;
    const nLin = R.linhas.length, altLetra = Math.round(p.bb.h / nLin);
    dl.innerHTML = `
      <dt>Produto</dt><dd>${R.nomeProduto}${R.duas ? ", em duas linhas" : ""}</dd>
      <dt>Peça</dt><dd>${Math.round(p.bb.w)}×${Math.round(p.bb.h)}mm, ${est.esp}mm (${(ESPESSURAS[est.esp]||{}).rot}), ${oca ? `escavada: parede ${R.luminaria.parede}mm` : `infill ${(ESPESSURAS[est.esp]||{infill:8}).infill}%`}</dd>
      <dt>Altura</dt><dd>${R.altUsada ? R.altUsada+"mm por linha" : "sem limite"}${R.comBase ? ", com base" : ""}</dd>
      <dt>Moldura</dt><dd>${R.delta ? R.delta+"mm" : "não se aplica"}</dd>
      <dt>Na mesa</dt><dd>${p.enc.ang?"na diagonal, ":""}ocupa ${Math.round(p.enc.uso)}mm de ${O.MESA}mm</dd>
      <dt>Estimativa</dt><dd>${gTotal.toFixed(0)}g${purga?` (${e.g.toFixed(0)}g + ${purga}g de purga)`:""} · ${Math.floor(minTotal/60)}h${String(Math.round(minTotal%60)).padStart(2,"0")}</dd>
      <dt>Preço sugerido</dt><dd class="preco">R$ ${preco}</dd>
      <dt>Retorno</dt><dd>R$ ${porHora.toFixed(0)} por hora de impressora</dd>`;

    const msgs = [];
    // A vistoria e a MESMA que decide o botao de baixar, logo abaixo. Antes
    // eram dois caminhos: um avisava, o outro liberava -- e peca em partes
    // soltas passava pelo segundo.
    for(const s of atual){
      for(const m of s.vist.motivos){
        const onde = atual.length > 1 && s.rot ? `A peça ${s.rot}: ` : "";
        msgs.push(["mal", onde + m + (!s.vist.enc.ok && R.duas ? " Nome composto em duas linhas fica alto — tente 17cm ou uma linha só." : "")]);
      }
    }
    if(R.larguraReal && R.larguraReal > R.larguraAlvo + 2)
      msgs.push(["bem", `A peça passou para ${Math.round(R.larguraReal)}mm de largura para não achatar as letras. É o limite da mesa que manda daqui em diante.`]);
    if(R.larguraReal && R.larguraReal < R.larguraAlvo - 2)
      msgs.push(["bem", `A largura sai em ${Math.round(R.larguraReal)}mm: a altura das letras é que manda, e a largura varia com o nome.`]);
    if(R.molduraFechouVazados)
      msgs.push(["mal", `A moldura precisou de ${R.delta}mm para unir as letras e isso fechou os vãos internas delas. As letras vão sair cheias. Reduza o tamanho ou use 1 cor.`]);
    if(R.luminaria){
      const L = R.luminaria;
      if(!L.possivel){
        msgs.push(["mal", L.motivo]);
      } else {
        msgs.push(["bem", `Luminária escavada: frente de ${L.face}mm para passar luz, parede de ${L.parede}mm, fundo aberto e rasgo de ${L.cabo}mm para o cabo.`]);
        if(!L.passaFita) msgs.push(["mal", L.motivo]);
        if(L.motivoPecaUnica) msgs.push(["bem", L.motivoPecaUnica]);
        msgs.push(["bem", `Imprima com a frente virada para a mesa: o vão interno fica para cima e não pede suporte.`]);
      }
    }
    if(altLetra < 35) msgs.push(["mal", `Letras de só ${altLetra}mm. Nome comprido demais para essa largura.`]);
    if(Object.keys(R.dils).length) msgs.push(["bem", `Acentos tratados: ${Object.entries(R.dils).map(([k,v])=>k+" (+"+v+")").join(", ")}`]);
    if(!msgs.some(x=>x[0]==="mal")) msgs.unshift(["bem","Peça conectada e cabe na mesa."]);
    av.innerHTML = msgs.map(([t,m])=>`<div class="aviso ${t}">${m}</div>`).join("");

    bx.innerHTML = atual.map((s,i)=>{
      const q = s.rot ? s.rot.split("-").pop().toLowerCase() : "arquivo";
      const trava = s.vist.ok ? "" : "disabled";
      const porque = s.vist.ok ? "" : ` title="${s.vist.motivos.join(" ")}"`;
      return `<button type="button" class="btn" data-i="${i}" ${trava}${porque}>Baixar ${q==="arquivo"?"o arquivo":"a peça "+q} — ${s.cor}<small>${s.nomeArq}</small></button>`;
    }).join("");
  }

  $("baixar").addEventListener("click", e=>{
    const b = e.target.closest(".btn"); if(!b || b.disabled || !atual) return;
    const s = atual[+b.dataset.i];
    const blob = new Blob([MorumbiNucleo.stlBinario(s.camadas).buffer], {type:"model/stl"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = s.nomeArq; a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
  });

  try{
    const b1 = MorumbiFontes.bytes(MorumbiFontes.b64.luckiest);
    if(window.FontFace && document.fonts){
      new FontFace("LetreiroFonte", b1.slice(0)).load().then(f=>document.fonts.add(f)).catch(()=>{});
    }
    G = MorumbiLetreiro.Gerador(MorumbiFontes.carregar(opentype));
    // O catalogo (/criar) tem um cartao por modelo. Sem isto, os seis cartoes
    // largavam a pessoa na mesma tela em Classico, e a escolha que ela ja
    // tinha feito no cartao se perdia no caminho.
    // A tela nasce mostrando o que est diz -- que pode vir do que ficou
    // guardado. Sem isto o estado voltava mas os botoes ficavam no padrao.
    if (salvo) {
      if (salvo.nome) $("nome").value = salvo.nome;

      // A TELA e quem decide o que e um valor valido, e por isso o estado e
      // relido dela depois de sincronizar. Filtrar so as chaves nao basta:
      // `esp: 999` e chave conhecida com valor que nao existe no menu, e ia
      // direto para o gerador enquanto a tela continuava mostrando 12 mm.
      for (const [caixa, chave, num] of [["tam","largura",true], ["ver","versao",true],
                                         ["prod","produto",false], ["base","base",true]]) {
        const alvo = [...$(caixa).children].find(b => String(b.dataset.v) === String(est[chave]));
        if (alvo) [...$(caixa).children].forEach(x => x.setAttribute("aria-pressed", x === alvo));
        const marcado = $(caixa).querySelector('.opt[aria-pressed="true"]');
        est[chave] = num ? +marcado.dataset.v : marcado.dataset.v;
      }
      const disp = [...$("disp").children].find(b => (b.dataset.v === "2") === !!est.duas);
      if (disp) [...$("disp").children].forEach(x => x.setAttribute("aria-pressed", x === disp));
      est.duas = $("disp").querySelector('.opt[aria-pressed="true"]').dataset.v === "2";

      for (const [id, chave] of [["esp","esp"], ["alt","alt"]]) {
        if ($(id).querySelector(`option[value="${est[chave]}"]`)) $(id).value = est[chave];
        const v = $(id).value;
        est[chave] = (chave === "alt" && v === "auto") ? "auto" : +v;
      }
    }

    // O modelo pedido pelo cartao do catalogo GANHA do que estava guardado:
    // quem clicou em "Terror" quer Terror, nao o que gerou semana passada.
    const pedido = new URLSearchParams(location.search).get("modelo");
    if (pedido) {
      const b = $("prod").querySelector(`.opt[data-v="${CSS.escape(pedido)}"]`);
      if (b) {
        [...$("prod").children].forEach(x => x.setAttribute("aria-pressed", x === b));
        est.produto = b.dataset.v;
      }
    }
    ajustarControles(); rodar();
  }catch(err){
    $("estado").textContent = "Não consegui carregar as fontes: " + err.message;
  }
})();
</script>
</body>
</html>
